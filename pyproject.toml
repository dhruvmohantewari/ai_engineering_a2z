[project]
name = "prac-agent-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dhruvmohantewari", email = "dhruvmohan048@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter-client>=8.10.0",
    "jupytext>=1.19.6",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-ollama>=1.1.0",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.14",
    "langsmith>=0.14.7",
    "notebook>=7.6.3",
    "pynvim>=0.6.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
]

[project.scripts]
prac-agent-course = "prac_agent_course:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
